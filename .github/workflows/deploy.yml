name: Build and deploy Pew-Pew

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pew-pew-production
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          test -n "$AWS_REGION" || (echo "Missing repository variable AWS_REGION"; exit 1)
          test -n "$AWS_ACCOUNT_ID" || (echo "Missing repository variable AWS_ACCOUNT_ID"; exit 1)
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || (echo "Missing repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"; exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "Missing repository variable NEXT_PUBLIC_API_URL"; exit 1)

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -f backend/Dockerfile -t "$ECR_REGISTRY/pew-pew-backend:$IMAGE_TAG" ./backend
          docker push "$ECR_REGISTRY/pew-pew-backend:$IMAGE_TAG"

      - name: Build and push frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -t "$ECR_REGISTRY/pew-pew-frontend:$IMAGE_TAG" ./frontend
          docker push "$ECR_REGISTRY/pew-pew-frontend:$IMAGE_TAG"

      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/pew-pew
            export ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose config --quiet
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
