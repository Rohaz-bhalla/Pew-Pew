services:
  backend:
    image: ${ECR_REGISTRY}/pew-pew-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost}
    expose:
      - "8080"
    networks:
      - app-network

  frontend:
    image: ${ECR_REGISTRY}/pew-pew-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
